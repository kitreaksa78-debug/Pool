<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Ball Pool AI Tester</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        canvas { border: 2px solid #fff; max-width: 100%; margin-top: 20px; }
        input[type="file"] { display: none; }
        .upload-btn { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        .upload-btn:hover { background-color: #0056b3; }
        #status { margin-top: 15px; color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>8 Ball Pool AI Tester</h1>
        <p>Upload a screenshot to test the OpenCV calculation</p>
        <label for="imageInput" class="upload-btn">Choose Image</label>
        <input type="file" id="imageInput" accept="image/*">
        <div id="status"></div>
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');
        let currentImage = null;

        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    sendToAPI(event.target.result);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function sendToAPI(base64Image) {
            statusDiv.innerText = "កំពុងគណនា... (អាចរង់ចាំ ៥០ វិនាទី បើ Server ដេក)";
            try {
                // ត្រូវប្រាកដថាតំណភ្ជាប់នេះត្រូវនឹង Render URL របស់អ្នក
                const response = await fetch('https://pool-027f.onrender.com/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });
                const data = await response.json();
                if (data.status === "success") {
                    statusDiv.innerText = "គណនារួចរាល់!";
                    drawLine(data.startX, data.startY, data.endX, data.endY);
                } else {
                    statusDiv.innerText = "Error: " + data.message;
                }
            } catch (error) {
                statusDiv.innerText = "កំហុសក្នុងការភ្ជាប់ទៅ API: " + error.message;
            }
        }

        function drawLine(startX, startY, endX, endY) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (currentImage) ctx.drawImage(currentImage, 0, 0);
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            ctx.stroke();
        }
    </script>
</body>
</html>
