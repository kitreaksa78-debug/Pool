<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Ball Pool AI Tester</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0; 
            padding: 20px; 
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
        }
        h1 { 
            color: #00d2ff; 
        }
        canvas { 
            border: 2px solid #333; 
            border-radius: 8px;
            max-width: 100%; 
            margin-top: 20px; 
            background-color: #000;
        }
        input[type="file"] { 
            display: none; 
        }
        .upload-btn { 
            background-color: #007bff; 
            color: white; 
            padding: 12px 24px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .upload-btn:hover { 
            background-color: #0056b3; 
        }
        #status { 
            margin-top: 20px; 
            color: #ffcc00; 
            font-weight: bold; 
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎱 8 Ball Pool AI Tester</h1>
        <p>Upload a screenshot to test the API calculation</p>
        
        <label for="imageInput" class="upload-btn">Choose Image</label>
        <input type="file" id="imageInput" accept="image/*">
        
        <div id="status"></div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusDiv = document.getElementById('status');

        // ពេលអ្នកប្រើជ្រើសរើសរូបភាព
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // បង្ហាញរូបភាពដើមនៅលើ Canvas សិន
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    
                    // បញ្ជូនទៅ API ដើម្បីគណនា
                    sendToAPI(event.target.result);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function sendToAPI(base64Image) {
            statusDiv.innerText = "⏳ កំពុងគណនា... (អាចរង់ចាំ ៥០ វិនាទី បើ Server ដេក)";
            
            try {
                // ប្តូរតំណភ្ជាប់នេះ ប្រសិនបើ Render URL របស់អ្នកផ្លាស់ប្តូរ
                const response = await fetch('https://pool-027f.onrender.com/api/calculate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                const data = await response.json();
                
                if (data.status === "success") {
                    statusDiv.innerText = "✅ គណនារួចរាល់! (បន្ទាត់ពណ៌ក្រហម)";
                    
                    // បង្ហាញរូបភាពថ្មីដែល Server បានគូរបន្ទាត់រួច
                    const newImg = new Image();
                    newImg.onload = function() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(newImg, 0, 0, canvas.width, canvas.height);
                    };
                    newImg.src = data.image;
                } else {
                    statusDiv.innerText = "❌ Error: " + data.message;
                }
            } catch (error) {
                statusDiv.innerText = "❌ កំហុសក្នុងការភ្ជាប់ទៅ API: " + error.message;
            }
        }
    </script>
</body>
</html>
